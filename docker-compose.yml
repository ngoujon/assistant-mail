services:
  mailzen:
    build: .
    container_name: mailzen
    restart: unless-stopped
    ports:
      - "3016:3016"
    environment:
      PORT: 3016
      DATA_DIR: /data
      # Clé de chiffrement des mots de passe IMAP/SMTP (À CHANGER)
      APP_SECRET: ${APP_SECRET:-change-me-please-32-chars-minimum}
      # Mot de passe d'accès à l'interface (vide = pas d'authentification)
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Ollama tournant sur la machine hôte
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    volumes:
      - mailzen-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mailzen-data:
